name: Monitor granizo Malargue

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-granizo
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - lugar: malargue
            nombre: ""
            lat: "-35.475"
            lon: "-69.585"
          - lugar: sanrafael
            nombre: "San Rafael"
            lat: "-34.6286"
            lon: "-68.3493"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: estado-${{ matrix.lugar }}-${{ github.run_id }}
          restore-keys: estado-${{ matrix.lugar }}-

      - name: Revisar rayos y pronostico
        run: python granizo_monitor.py
        env:
          NTFY_TOPIC: ${{ matrix.lugar == 'sanrafael' && secrets.NTFY_TOPIC_SR || secrets.NTFY_TOPIC }}
          LAT: ${{ matrix.lat }}
          LON: ${{ matrix.lon }}
          LUGAR: ${{ matrix.nombre }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: estado-${{ matrix.lugar }}-${{ github.run_id }}
